    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            lightIcon.classList.remove('hidden');
            darkIcon.classList.add('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            lightIcon.classList.toggle('hidden');
            darkIcon.classList.toggle('hidden');
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });
    function toggleFavorite(breedId, btnElement) {
    let favorites = JSON.parse(localStorage.getItem('myFavorites')) || [];
    const icon = btnElement.querySelector('i');
    
    if (favorites.includes(breedId)) {
        favorites = favorites.filter(id => id !== breedId);
        icon.classList.remove('text-red-500');
        icon.classList.add('text-gray-400');
    } else {
        favorites.push(breedId);
        icon.classList.remove('text-gray-400');
        icon.classList.add('text-red-500');
    }
    localStorage.setItem('myFavorites', JSON.stringify(favorites));
}

// При завантаженні перевіряємо всі картки на головній
window.addEventListener('DOMContentLoaded', () => {
    const favorites = JSON.parse(localStorage.getItem('myFavorites')) || [];
    const buttons = document.querySelectorAll('button[onclick^="toggleFavorite"]');
    
    buttons.forEach(btn => {
        // Отримуємо ID породи з атрибута onclick
        const match = btn.getAttribute('onclick').match(/'([^']+)'/);
        if (match) {
            const breedId = match[1];
            if (favorites.includes(breedId)) {
                const icon = btn.querySelector('i');
                icon.classList.add('text-red-500');
                icon.classList.remove('text-gray-400');
            }
        }
    });
});
    // Знаходимо елементи
const searchBtn = document.getElementById('search-btn');
const searchBar = document.getElementById('search-bar');
const closeSearch = document.getElementById('close-search');
const searchInput = document.getElementById('breed-search');
const cards = document.querySelectorAll('main .group.relative');
const notFoundMessage = document.getElementById('not-found-message');
const mainHeader = document.querySelector('header');

// Функція фільтрації
function filterBreeds(query) {
    const cleanQuery = query.toLowerCase().trim();
    let hasResults = false;

    // 1. Керування видимістю фото (Header)
    if (mainHeader) {
        mainHeader.style.display = (cleanQuery.length > 0) ? 'none' : 'block';
    }

    // 2. Фільтрація карток
    cards.forEach(card => {
        // Беремо весь текст з картки, щоб точно нічого не пропустити
        const breedName = card.innerText.toLowerCase();
        const words = breedName.split(/\s+/);
        
        // Перевіряємо чи починається хоча б одне слово з запиту
        const isMatch = words.some(word => word.startsWith(cleanQuery));

        if (isMatch) {
            card.style.display = 'block';
            hasResults = true;
        } else {
            card.style.display = 'none';
        }
    });

    // 3. Повідомлення про помилку
    if (notFoundMessage) {
        if (cleanQuery.length > 0 && !hasResults) {
            notFoundMessage.classList.remove('hidden');
        } else {
            notFoundMessage.classList.add('hidden');
        }
    }
}

// Події
if (searchBtn) {
    searchBtn.addEventListener('click', () => {
        searchBar.classList.toggle('hidden');
        if (!searchBar.classList.contains('hidden')) searchInput.focus();
    });
}

if (closeSearch) {
    closeSearch.addEventListener('click', () => {
        searchBar.classList.add('hidden');
        searchInput.value = '';
        filterBreeds('');
    });
}

if (searchInput) {
    searchInput.addEventListener('input', (e) => filterBreeds(e.target.value));
}
